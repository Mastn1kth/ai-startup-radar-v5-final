name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  docker-build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - run: docker build -t ${{ secrets.DOCKER_USERNAME }}/radar-backend:latest ./backend
      - run: docker build -t ${{ secrets.DOCKER_USERNAME }}/radar-frontend:latest ./frontend
      - run: docker push ${{ secrets.DOCKER_USERNAME }}/radar-backend:latest
      - run: docker push ${{ secrets.DOCKER_USERNAME }}/radar-frontend:latest

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            cd /opt/radar
            docker-compose pull
            docker-compose up -d
          '
