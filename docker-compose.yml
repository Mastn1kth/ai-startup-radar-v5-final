version: '3.8'

services:
  # PostgreSQL - база данных
  postgres:
    image: postgres:16-alpine
    container_name: radar-postgres
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar_secret_2026
      POSTGRES_DB: ai_startup_radar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d ai_startup_radar"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - radar-network

  # Redis - кэш и очереди
  redis:
    image: redis:7-alpine
    container_name: radar-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - radar-network

  # Qdrant - векторный поиск
  qdrant:
    image: qdrant/qdrant:latest
    container_name: radar-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - radar-network

  # Ollama - НЕ В DOCKER, а на Windows (ollama.com)
  # backend подключается через host.docker.internal:11434
  ollama:
    image: alpine:latest
    container_name: radar-ollama-dummy
    command: sh -c "echo 'Ollama runs on Windows host at localhost:11434' && sleep infinity"
    networks:
      - radar-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: radar-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - radar-network

  # Celery Worker (фоновые задачи)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: radar-celery-worker
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    volumes:
      - backend_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - radar-network

  # Celery Beat (планировщик)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: radar-celery-beat
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file:
      - .env
    volumes:
      - celery_beat:/app/celerybeat
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - radar-network

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: radar-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_started
    networks:
      - radar-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_data:
  backend_logs:
  celery_beat:

networks:
  radar-network:
    driver: bridge